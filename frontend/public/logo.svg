  <!-- Flask fill -->
  <path d="M82 30 C82 30 82 55 78 72 C72 92 52 112 40 135 C28 158 35 188 100 188 C165 188 172 158 160 135 C148 112 128 92 122 72 C118 55 118 30 118 30 Z"
        fill="oklch(93% 0.04 251.813)" fill-opacity="0.72" stroke="oklch(67% 0.19 259.815)" stroke-width="4" stroke-linejoin="round"/>

  <!-- Liquid -->
  <g clip-path="url(#flask-clip)">
    <g class="liquid-back">
      <path class="wave-back"
            d="M20 125 Q50 105 100 125 Q150 145 180 123 L180 210 L20 210 Z"
            fill="oklch(48% 0.21 17)"/>
    </g>
    <g class="liquid-fwd">
