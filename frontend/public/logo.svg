<svg width="100%" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="flask-clip">
      <path d="M82 30 C82 30 82 55 78 72 C72 92 52 112 40 135 C28 158 35 188 100 188 C165 188 172 158 160 135 C148 112 128 92 122 72 C118 55 118 30 118 30 Z"/>
    </clipPath>
  </defs>
  <style>
    @keyframes sway-fwd {
      0%   { transform: translateX(0px) scaleX(1); }
      25%  { transform: translateX(10px) scaleX(1.06); }
      50%  { transform: translateX(0px) scaleX(1); }
      75%  { transform: translateX(-10px) scaleX(1.06); }
      100% { transform: translateX(0px) scaleX(1); }
    }
    @keyframes wave-fwd {
      0%   { d: path("M20 125 Q50 107 100 123 Q150 139 180 121 L180 210 L20 210 Z"); }
      25%  { d: path("M20 125 Q50 141 100 123 Q150 105 180 127 L180 210 L20 210 Z"); }
      50%  { d: path("M20 125 Q50 107 100 125 Q150 139 180 121 L180 210 L20 210 Z"); }
      75%  { d: path("M20 125 Q50 141 100 123 Q150 105 180 129 L180 210 L20 210 Z"); }
      100% { d: path("M20 125 Q50 107 100 123 Q150 139 180 121 L180 210 L20 210 Z"); }
    }
    @keyframes wave-back {
      0%   { d: path("M20 125 Q50 105 100 125 Q150 145 180 123 L180 210 L20 210 Z"); }
      25%  { d: path("M20 125 Q50 143 100 121 Q150 101 180 125 L180 210 L20 210 Z"); }
      50%  { d: path("M20 125 Q50 107 100 127 Q150 143 180 123 L180 210 L20 210 Z"); }
      75%  { d: path("M20 125 Q50 143 100 123 Q150 103 180 125 L180 210 L20 210 Z"); }
      100% { d: path("M20 125 Q50 105 100 125 Q150 145 180 123 L180 210 L20 210 Z"); }
    }
    .liquid-back {
      transform-origin: 100px 155px;
      animation: sway-fwd 3.2s ease-in-out infinite reverse;
    }
    .liquid-fwd {
      transform-origin: 100px 155px;
      animation: sway-fwd 3.2s ease-in-out infinite;
    }
    .wave-back { animation: wave-back 3.2s ease-in-out infinite; }
    .wave-fwd  { animation: wave-fwd  3.2s ease-in-out infinite; }
  </style>

  <!-- Cork bottom (inside neck) y+10: 18→28 -->
  <rect x="82" y="25" width="36" height="14" rx="2"
        fill="oklch(52% 0.09 55)" stroke="oklch(40% 0.08 53)" stroke-width="1.5"/>
  <!-- Cork top y+10: 4→14 -->
