  </g>

  <!-- Flask outline on top -->
  <path d="M82 30 C82 30 82 55 78 72 C72 92 52 112 40 135 C28 158 35 188 100 188 C165 188 172 158 160 135 C148 112 128 92 122 72 C118 55 118 30 118 30 Z"
