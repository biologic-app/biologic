# Frontend CI — запускается только на изменения в frontend/.
#
# Решения по scope (2026-07-09, осознанно):
#   - typecheck идёт ПОСЛЕ build: `auto-imports.d.ts`/`components.d.ts` (Nuxt UI)
#     gitignored и генерируются vite при сборке — без них vue-tsc не находит
#     авто-импорты (useToast/useAppConfig/defineShortcuts).
#   - eslint пока НЕ блокирующий: в репозитории ~54 предсуществующие ошибки
#     (no-explicit-any и пр.), они гасятся в рефакторинге FE (ROADMAP D3/Phase 6).
#     До этого eslint информирует, но не роняет PR — как diff-scoped lint в staraudio.
name: Frontend CI

on:
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  push:
    branches: [master]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  build-typecheck:
    name: Build + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: bun install --frozen-lockfile
      # build первым — генерирует auto-imports.d.ts/components.d.ts, нужные vue-tsc
      - run: bun run build
      - run: bun run typecheck

  unit:
    name: Unit tests (bun)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: bun install --frozen-lockfile
      - run: bun test tests/shared

  lint:
    name: ESLint (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true # предсуществующий долг ~54 ошибки; блокировать начнём после ROADMAP D3
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: bun install --frozen-lockfile
      - run: bun run lint
