# e2e — сквозной стенд на изменения в backend/ ИЛИ frontend/: Postgres → миграции → seed →
# собранный SPA, поднятый тем же backend-процессом (APP_STATIC_DIR) → Playwright (UI) и,
# если сценарии присутствуют в репозитории, k6 (API-контракт). См. ROADMAP §A1.4.
name: E2E CI

on:
  pull_request:
    paths: ["backend/**", "frontend/**", ".github/workflows/e2e.yml"]
  push:
    branches: [master]
    paths: ["backend/**", "frontend/**", ".github/workflows/e2e.yml"]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright + k6 (полный стенд)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: biologic
          POSTGRES_PASSWORD: biologic
          POSTGRES_DB: biologic
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U biologic -d biologic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_DATABASE_URL: postgresql+asyncpg://biologic:biologic@localhost:5433/biologic
      APP_JWT_SECRET_KEY: ci-e2e-secret
      APP_AUTH_COOKIE_SECURE: "false"
      APP_AUTH_COOKIE_DOMAIN: localhost
      APP_STATIC_DIR: ${{ github.workspace }}/frontend/dist
      # localhost (не 127.0.0.1) — совпадает с APP_AUTH_COOKIE_DOMAIN=localhost, иначе
      # браузер Playwright не примет cookie сессии как same-origin.
      E2E_BASE_URL: http://localhost:8080
      K6_BASE_URL: http://localhost:8080/api/v1
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"
      - run: cd backend && uv sync --all-extras

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: cd frontend && bun install --frozen-lockfile

      - name: Миграции (включая seed RBAC-пользователей)
        run: cd backend && uv run alembic upgrade head

      # Справочники/каталоги для сценариев, не покрытых RBAC-миграцией.
      - run: make be-seed-data

      # Сборка SPA до старта backend — тот же процесс на :8080 отдаёт /api/v1 и статику
      # через APP_STATIC_DIR (см. src/app_factory.py).
      - run: cd frontend && bun run build

      - name: Запустить backend (API + собранный SPA) в фоне
        run: |
          cd backend
          nohup uv run uvicorn src.main:app --host 0.0.0.0 --port 8080 > ../backend.log 2>&1 &
          echo $! > ../backend.pid

      - name: Дождаться готовности backend
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/v1/health > /dev/null; then
              echo "backend готов"
              exit 0
            fi
            sleep 1
          done
          echo "backend не поднялся за отведённое время"
          cat backend.log
          exit 1

      - name: Установить браузер Playwright (Chromium)
        run: cd frontend && bunx playwright install --with-deps chromium

      # playwright.config.ts подставляет исполняемый файл Chromium из
      # PLAYWRIGHT_CHROMIUM_PATH (в этом монорепо путь по умолчанию — под sandbox-образ
      # разработки, в CI его нет) — находим установленный playwright install и пробрасываем.
      - name: Определить путь к установленному Chromium
        run: |
          CHROME_PATH=$(find ~/.cache/ms-playwright -maxdepth 2 -type d -name 'chromium-*' | head -n1)/chrome-linux/chrome
          echo "PLAYWRIGHT_CHROMIUM_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Playwright e2e
        run: cd frontend && bun run test:e2e

      # k6-сценарии контракта API (tests/k6/scenarios/*) — прогоняются на уже поднятом
      # backend. Каталог сценариев в репозитории один (workflow); при появлении новых
      # добавь их в K6_CONTEXTS в корневом Makefile — команда подхватит их сама.
      - name: Установить k6
        uses: grafana/setup-k6-action@v1

      - name: k6-сценарии
        run: make be-k6-scenarios

      - name: Логи backend
        if: always()
        run: cat backend.log || true

      - name: Остановить backend
        if: always()
        run: kill "$(cat backend.pid)" 2>/dev/null || true

      - name: Артефакты Playwright (отчёты/трейсы/скриншоты)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Артефакты k6 (JSON + визуальный отчёт)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-report
          path: backend/reports/k6/
          retention-days: 7
          if-no-files-found: ignore
