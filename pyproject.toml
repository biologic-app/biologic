[project]
name = "biologic-system-backend"
version = "0.1.0"
requires-python = ">=3.11.0"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.129.0",
    "mkdocstrings-python>=2.0.2",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.13.0",
    "scalar-fastapi>=1.6.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.22",
    "sqlalchemy[asyncio]>=2.0.46",
    "uuid6>=2025.0.1",
    "uvicorn[standard]>=0.40.0",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "factory-boy>=3.3.3",
    "faker>=40.4.0",
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.1",
]


[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
exclude = [
    ".venv",
    "alembic/versions",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "ASYNC",
    "C4",
    "SIM",
    "RUF",
]
ignore = [
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '''
/(
    \.venv
  | alembic/versions
)/
'''

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
exclude = [
    "^alembic/",
]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-q --strict-config --strict-markers --cov=src --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "api: API tests",
    "db_plan: PostgreSQL query plan analysis tests",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "tests/*",
    "alembic/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
