[project]
name = "biologic-system-backend"
version = "0.1.0"
requires-python = ">=3.11.0"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.129.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.13.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.22",
    "sqlalchemy[asyncio]>=2.0.46",
    "uuid6>=2025.0.1",
    "uvicorn[standard]>=0.40.0",
    "loguru>=0.7.3",
    "pygments>=2.19.2",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.1",
]

[dependency-groups]
dev = [
    
    "scalar-fastapi>=1.6.2",
    "factory-boy>=3.3.3",
    "faker>=40.4.0",
    "httpx>=0.28.1",
    "pip-audit>=2.10.0",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.1",
    "xlwt>=1.3.0",
]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
extend-select = ["PLC0415","TID252"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = "."
# Restrict collection to the test suite. Without this, pytest's default
# test_*.py glob also scans src/ and imports src/infrastructure/db/models/
# test_status.py, re-registering its SQLAlchemy mapper → InvalidRequestError.
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "tests/*",
    "alembic/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
