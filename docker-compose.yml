services:
  postgres:
    image: postgres:15
    container_name: bio-new-backend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: biologic
      POSTGRES_USER: biologic
      POSTGRES_PASSWORD: biologic
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biologic -d biologic"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
